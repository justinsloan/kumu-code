title: Kumu
description: A small, BASIC-inspired programming language built for teaching.
theme: just-the-docs

url: https://justinsloan.github.io
baseurl: /kumu-code

# --- just-the-docs ---------------------------------------------------
search_enabled: true
search:
  heading_level: 2
  previews: 3
  preview_words_before: 5
  preview_words_after: 10
  tokenizer_separator: /[\s/]+/
  rel_url: true
  button: false

heading_anchors: true

aux_links:
  View on GitHub:
    - https://github.com/justinsloan/kumu-code
aux_links_new_tab: true

back_to_top: true
back_to_top_text: Back to top

footer_content: >-
  Kumu is released under the MIT License.


exclude:
  - Gemfile
  - Gemfile.lock
  - vendor/
  - .jekyll-cache/
